name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gem:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Download and verify the jar
        run: rake jar:fetch

      - name: Build the gem
        run: gem build ontoportal-bubastis.gemspec

      - name: Install the gem
        run: gem install --local ./ontoportal-bubastis-*.gem

      # Uses Ontoportal::Bubastis.jar_path from the installed gem and checks
      # the XML report, since bubastis exits 0 when a diff fails.
      - name: Smoke test the installed gem
        run: script/smoke-test

      - name: Upload the gem
        if: ${{ !cancelled() && matrix.java == '11' }}
        uses: actions/upload-artifact@v7
        with:
          name: ontoportal-bubastis-gem
          path: ontoportal-bubastis-*.gem
          if-no-files-found: error
